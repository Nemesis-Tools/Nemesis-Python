<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nemesis</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/logo.png">
<style>
  /* ===== Theme (edit these to freely restyle) ===== */
  :root{
    --bg:#191A1B; --panel:#202122; --panel2:#26282a; --border:#8C8C8C;
    --text:#c9d1d9; --muted:#8b949e; --accent:#2272EB; --accent2:#2272EB;
    --log:#00C473;
    --crit:#7b1fa2; --high:#c62828; --med:#ef6c00; --low:#f9a825; --info:#607d8b;
    --radius:4px; --mono:'Consolas','D2Coding',monospace;
    --font:'Segoe UI','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  a{color:var(--accent2)}
  .row{display:flex;align-items:center;gap:8px}
  .grow{flex:1}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:7px 12px;cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:6px}
  button:hover{background:var(--border)}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{background:var(--accent2)}
  input[type=text],textarea,select,input:not([type]){background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:6px 9px;font-family:var(--font)}
  input:focus,textarea:focus{outline:none;border-color:var(--accent2)}
  svg.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #btnSettings{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  #btnSettings svg.ic{width:18px;height:18px}
  /* ===== Custom frameless title bar (desktop app) ===== */
  #titlebar{display:flex;align-items:center;height:34px;background:var(--panel);border-bottom:1px solid var(--border);padding:0 6px 0 12px;user-select:none;flex:0 0 auto}
  #titlebar .tb-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
  #titlebar .tb-logo{width:16px;height:16px;border-radius:3px;object-fit:contain}
  .winbtn{-webkit-app-region:no-drag;width:40px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:4px;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
  .winbtn:hover{background:var(--panel2);color:var(--text)}
  .winbtn.close:hover{background:#e5484d;color:#fff}
  .winbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  /* ===== Header / toolbar ===== */
  header{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;gap:8px}
  .brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px}
  .brand .logo{height:30px;width:30px;object-fit:contain;border-radius:4px;display:block}
  .brand .dot{color:var(--accent2)}
  .toolbar input#url{flex:1}
  .toolbar > input, .toolbar > button{height:34px;box-sizing:border-box;line-height:normal}
  .toolbar > input{padding:0 10px}
  .toolbar > button{padding:0 14px}
  .scope{color:#f0777b;font-weight:600;font-size:12px;display:flex;align-items:center;gap:6px}
  /* ===== Settings panel ===== */
  /* settings as a switchable main panel (single column) */
  #settings{display:none;grid-column:1/3;grid-row:1;margin:0;border-radius:0;background:var(--panel)}
  #settings.open{display:flex}
  #settings .scroll{padding:18px 22px;scrollbar-width:none}
  #settings .scroll::-webkit-scrollbar{display:none}
  .sect{max-width:640px;margin:0 auto 18px}
  .sect h4{margin:0 0 10px;font-size:12px;color:var(--accent2);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.4px}
  .sect label{display:block;font-size:12px;margin:8px 0 3px;color:var(--muted)}
  .sect input[type=text],.sect textarea{width:100%}
  .fld{display:block}
  .fld > div{margin-bottom:2px}
  /* prettier settings fields */
  #settings .sect label:has(input[type=checkbox]){display:flex;align-items:center;gap:10px;padding:11px 13px;margin:8px 0;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
  #settings .sect label:has(input[type=checkbox]):hover{border-color:var(--accent2);background:var(--panel2)}
  #settings .sect label:has(input[type=checkbox]) input{margin:0;width:15px;height:15px}
  #settings input[type=text],#settings textarea{margin-bottom:8px;background:var(--bg)}
  #settings .fld > div{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:9px 11px;margin-bottom:8px}
  #settings .fld > div label{margin:0 0 5px}
  #settings .fld > div input{margin-bottom:0}
  .sfoot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--panel)}
  /* files panel (switches into main like settings) */
  #files{display:none;grid-column:1/3;grid-row:1;margin:0;border-radius:0;background:var(--panel)}
  #files.open{display:flex}
  #files .scroll{scrollbar-width:none}
  #files .scroll::-webkit-scrollbar{display:none}
  .frow{display:flex;align-items:center;gap:10px;padding:12px 14px;margin:8px 0;background:var(--bg);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--text);transition:border-color .15s,background .15s}
  .frow:hover{border-color:var(--accent2);background:var(--panel2)}
  .frow svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:2}
  .frow .dl{color:var(--accent2);font-size:11px}
  #filesList .empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
  /* ===== Main layout ===== */
  main{flex:1;display:grid;grid-template-columns:280px 1fr;grid-template-rows:1fr;gap:0;padding:0;min-height:0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .card > .hd{padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  /* Left sidebar (flush to the edge) */
  #tech{border:none;border-right:1px solid var(--border);border-radius:0;background:var(--panel)}
  #tree{scrollbar-width:none}
  #tree::-webkit-scrollbar{display:none}
  #live{margin:0;border-radius:0;border-left:none}
  .scroll{overflow:auto;flex:1;min-height:0}
  /* ===== Bottom panel (full-width footer, VS Code style) ===== */
  #bottom{height:250px;min-height:120px;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--border)}
  /* Tech tree */
  .cat{padding:6px 10px;border-bottom:1px solid var(--panel2)}
  .cat > .chead{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
  .cat .mods{margin:4px 0 2px 20px}
  .mitem{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:12px}
  .mitem label{color:var(--text);cursor:pointer}
  /* Address bar (interactive viewer) */
  .addrbar{display:flex;align-items:center;gap:5px;padding:6px 8px;background:var(--panel2,#0e1526);border-bottom:1px solid var(--line,#1e2a44)}
  .addrbar input{flex:1;min-width:0;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line,#26324e);background:var(--bg,#0a0f1e);color:var(--text,#e7eefc);font-size:12px;font-family:var(--mono)}
  .addrbar input:focus{outline:none;border-color:var(--accent,#2272eb)}
  .addrbar .navbtn{height:28px;min-width:28px;padding:0 8px;border-radius:7px;border:1px solid var(--line,#26324e);background:var(--bg,#0a0f1e);color:var(--text,#cdd8f0);cursor:pointer;font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .addrbar .navbtn:hover{border-color:var(--accent,#2272eb);color:#fff}
  .addrbar .navbtn.go{font-size:12px;font-weight:600}
  /* Live view */
  .liveview{position:relative;flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #liveimg{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
  #liveimg:focus{outline:none}
  #live.interactive #liveimg{object-fit:contain;object-position:center center;cursor:crosshair}
  #live.interactive #liveinfo{display:none!important}
  #liveph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px}
  #liveinfo{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.68);color:var(--log);font-family:var(--mono);font-size:11px;line-height:1.55;padding:8px 12px;max-height:48%;overflow:auto;white-space:pre-wrap;display:none}
  /* status light (soft glow) */
  .sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .sdot.idle{background:#ff9800;animation:glow-o 2s infinite}
  .sdot.live{background:var(--accent);animation:glow-b 1.2s infinite}
  .sdot.stop{background:#e5484d;animation:glow-r 1.6s infinite}
  @keyframes glow-o{0%,100%{box-shadow:0 0 3px 1px rgba(255,152,0,.5)}50%{box-shadow:0 0 7px 2px rgba(255,152,0,.85)}}
  @keyframes glow-b{0%,100%{box-shadow:0 0 3px 1px rgba(34,114,235,.5)}50%{box-shadow:0 0 9px 3px rgba(34,114,235,.9)}}
  @keyframes glow-r{0%,100%{box-shadow:0 0 3px 1px rgba(229,72,77,.5)}50%{box-shadow:0 0 8px 2px rgba(229,72,77,.9)}}
  /* Bottom tabs */
  .tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg)}
  .tab{padding:7px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-size:12px}
  .tab.active{color:var(--text);border-bottom-color:var(--accent2)}
  #log{flex:1;overflow:auto;background:var(--bg);color:var(--log);font-family:var(--mono);font-size:12px;padding:8px 10px;white-space:pre-wrap;margin:0}
  #terminput-row{position:relative;display:flex;align-items:center;gap:8px;background:var(--bg);border-top:1px solid var(--border);padding:6px 10px}
  #terminput-row .tprompt{color:var(--accent2);font-family:var(--mono);font-weight:700}
  #terminput{flex:1;background:transparent;border:none;outline:none;color:var(--log);font-family:var(--mono);font-size:12px;padding:2px 0}
  #termsuggest{display:none;position:absolute;left:8px;right:8px;bottom:calc(100% + 4px);background:var(--panel2);border:1px solid var(--border);border-radius:4px;max-height:240px;overflow:auto;box-shadow:0 -8px 24px rgba(0,0,0,.45);z-index:30}
  #termsuggest .sgrow{padding:7px 11px;font-family:var(--mono);font-size:12px;cursor:pointer;display:flex;gap:8px}
  #termsuggest .sgrow:hover{background:var(--accent);color:#fff}
  #termsuggest .sgrow:hover .muted{color:#dbe7ff}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{position:sticky;top:0;background:var(--panel2);color:var(--muted);text-align:left;padding:6px 8px;font-weight:600}
  td{padding:5px 8px;border-bottom:1px solid var(--panel2);vertical-align:top}
  tr.fnd{cursor:pointer}
  tr.fnd:hover{background:var(--panel2)}
  .sev{display:inline-block;padding:1px 7px;border-radius:4px;color:#fff;font-size:11px;font-weight:700}
  /* progress */
  #prog{height:16px;background:var(--panel);border:1px solid var(--border);border-radius:4px;overflow:hidden;flex:1;position:relative}
  #progbar{height:100%;width:0;background:var(--accent);transition:width .35s ease}
  #progtxt{position:absolute;inset:0;text-align:center;font-size:11px;line-height:16px;color:var(--text)}
  /* modal */
  #modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center}
  #modal.open{display:flex}
  .mbox{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:min(820px,92vw);max-height:88vh;display:flex;flex-direction:column}
  .mbox .mhd{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
  .fbbtn{display:inline-flex;align-items:center;gap:5px}
  .fbbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .fbbtn.tp:hover{color:#2e7d32;border-color:#2e7d32}
  .fbbtn.fp:hover{color:#c62828;border-color:#c62828}
  .mbox pre{flex:1;overflow:auto;margin:0;padding:14px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:var(--text)}
  .mbox .mft{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
  .muted{color:var(--muted)}
  /* file dropdown */
  .menu{position:fixed;z-index:60;background:var(--panel2);border:1px solid var(--border);border-radius:4px;min-width:240px;max-height:320px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
  .menu.open{display:block}
  .menu .mrow{display:flex;align-items:center;gap:9px;padding:8px 11px;cursor:pointer;font-size:12px;font-family:var(--mono);color:var(--text)}
  .menu .mrow:hover{background:var(--accent);color:#fff}
  .menu .mrow svg{width:15px;height:15px;flex:0 0 auto}
  .menu .empty{padding:12px;color:var(--muted);font-size:12px;text-align:center}
  /* toasts (bottom-center) */
  #toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{display:flex;align-items:center;gap:9px;min-width:200px;max-width:80vw;padding:11px 18px;border-radius:6px;font-size:13px;font-weight:500;color:#fff;background:#333;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transform:translateY(14px);animation:toast-in .26s cubic-bezier(.2,.9,.3,1) forwards;pointer-events:auto}
  .toast.out{animation:toast-out .24s ease forwards}
  .toast .ti{font-weight:800;font-size:13px;display:inline-flex;width:16px;justify-content:center}
  .toast.success{background:#00C473}
  .toast.error{background:#e5484d}
  .toast.info{background:var(--accent)}
  @keyframes toast-in{to{opacity:1;transform:translateY(0)}}
  @keyframes toast-out{to{opacity:0;transform:translateY(14px)}}
  /* ===== Micro animations ===== */
  @keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
  @keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes headerDrop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  header{animation:headerDrop .35s cubic-bezier(.2,.9,.3,1)}
  #tech,#live{animation:panelIn .28s ease}
  #settings.open,#files.open{animation:panelIn .24s ease}
  #bottom{animation:panelIn .3s ease}
  button{transition:background .15s ease, border-color .15s ease, transform .08s ease, color .15s ease}
  button:hover{transform:translateY(-1px)}
  button:active{transform:translateY(1px)}
  button:disabled{transform:none}
  .tab{transition:color .15s ease, border-color .2s ease}
  .mitem,.cat .chead,.frow,.sect label{transition:background .15s ease, border-color .15s ease, color .15s ease}
  .mitem:hover label{color:var(--accent2)}
  tr.fnd{animation:rowIn .26s ease}
  tr.fnd td{transition:background .12s ease}
  #modal.open{animation:fadeIn .18s ease}
  #modal.open .mbox{animation:popIn .22s cubic-bezier(.2,.9,.3,1)}
  #liveimg{transition:opacity .25s ease}
  .sdot{transition:background .2s ease}
  input[type=checkbox]{transition:transform .1s ease}
  input[type=checkbox]:active{transform:scale(.9)}
  #progbar{will-change:width}
  .brand .logo{transition:transform .3s ease}
  .brand .logo:hover{transform:rotate(-6deg) scale(1.08)}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="titlebar" class="pywebview-drag-region">
  <span class="tb-title"><img class="tb-logo" src="/logo.png" onerror="this.style.display='none'"> Nemesis</span>
  <span class="grow"></span>
  <button id="winmin" class="winbtn" title="최소화"><svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <button id="winclose" class="winbtn close" title="닫기"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
</div>
<header>
  <div class="row">
    <div class="brand"><img class="logo" src="/logo.png" alt="logo" onerror="this.style.display='none'"></div>
    <div class="grow"></div>
    <button id="btnSettings" title="설정"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div class="toolbar row">
    <input id="url" type="text" placeholder="https://example.com/page?id=1">
    <button id="btnStart" class="primary"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg> Start</button>
    <button id="btnStop" disabled><svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> Stop</button>
    <button id="btnReport"><svg class="ic" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Report</button>
    <button id="btnRec" title="스캔 라이브 뷰 녹화 파일 목록"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="6"/></svg> Tape</button>
  </div>

</header>

<main>
  <div id="tech" class="card">
    <div class="hd">Attack Types <span class="muted" id="selcount" style="margin-left:auto;font-weight:400;font-size:11px"></span></div>
    <div class="scroll" id="tree"></div>
  </div>

  <div id="live" class="card">
    <div class="hd"><span class="sdot idle" id="sdot"></span> Attack Viewer</div>
    <div class="addrbar" id="addrbar-row" style="display:none">
      <button class="navbtn" id="ibBack" title="뒤로">‹</button>
      <button class="navbtn" id="ibFwd" title="앞으로">›</button>
      <button class="navbtn" id="ibReload" title="새로고침">⟳</button>
      <input id="addrbar" type="text" spellcheck="false" autocomplete="off" placeholder="주소 입력 후 Enter">
      <button class="navbtn go" id="ibGo">이동</button>
    </div>
    <div class="liveview" id="liveview">
      <img id="liveimg" tabindex="0" style="display:none">
      <div id="liveph">Start 를 누르면 해당 URL이<br>여기 뷰어에 열리고, <b>클릭·입력</b>할 수 있습니다.<br><span class="muted">스캔은 <code>/scan</code>·<code>/auto</code> 또는 공격 번호로 실행합니다.</span></div>
      <div id="liveinfo"></div>
    </div>
  </div>

  <div id="settings" class="card">
    <div class="tabs" id="stabs">
      <div class="tab active" data-s="0">옵션</div>
      <div class="tab" data-s="1">재귀 크롤 · 연쇄</div>
      <div class="tab" data-s="2">인증 · 식별</div>
      <div class="tab" data-s="3">OOB · SSRF</div>
    </div>
    <div class="scroll">
      <div class="sect" data-s="0">
        <label style="color:var(--text)"><input type="checkbox" id="o_headless" checked> 헤드리스 브라우저</label>
        <label style="color:var(--text)"><input type="checkbox" id="o_devtools"> DevTools(F12) 자동 열기</label>
        <label style="color:var(--text)"><input type="checkbox" id="o_tls" checked> TLS 인증서 검증</label>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const SEV={Critical:'var(--crit)',High:'var(--high)',Medium:'var(--med)',Low:'var(--low)',Info:'var(--info)'};
let logCur=0, findCur=0, poller=null, framer=null, findingsBuf=[], stopped=false;
let rec=null, recChunks=[], recCanvas=null, recCtx=null, recURL=null;
let reports=[], recordings=[];   // {ts, url}
let loginCreds={login_url:'',username:'',password:''}, loginState=null;
let credState=null, credBuf={}, credPrompting=false;
let keyState=null, testActive=false, testPoller=null, testSeen=false;
// ---- LLM provider + model selection (/test picker, /model, /key) ----
let providers=[], numMode=null, pendingTest=null;   // numMode: 'provider'|'model'|null
async function loadProviders(){
  try{ const j=await (await fetch('/api/providers')).json(); providers=j.providers||[]; }
  catch(e){ providers=[]; }
}
function provById(id){ return providers.find(p=>p.id===id); }
function curProvider(){ const id=localStorage.getItem('nemesisProvider')||'gemini'; return provById(id)?id:'gemini'; }
function keyFor(id){ return localStorage.getItem('nemesisKey_'+id)||''; }
function modelFor(id){ const p=provById(id); return localStorage.getItem('nemesisModel_'+id)||(p?p.default:''); }
function allKeys(){ const o={}; providers.forEach(p=>{ const k=keyFor(p.id); if(k) o[p.id]=k; }); return o; }
function allModels(){ const o={}; providers.forEach(p=>{ o[p.id]=modelFor(p.id); }); return o; }
function printProviders(){
  if(!providers.length){ termLog('제공자 목록 로딩 중… 잠시 후 /test 다시 입력.'); loadProviders(); return; }
  termLog('── /test 실행할 LLM 제공자 선택 ──');
  termLog(' 1.  전체 사용 (키 있는 모든 제공자로 교차 검증)');
  providers.forEach((p,i)=>termLog(String(i+2).padStart(2,' ')+'.  '+p.label+'   '+(keyFor(p.id)?'✓키':'✗키')+'  · '+p.free));
  termLog('▶ 번호를 입력하세요. (키가 없으면 입력 요청)'); numMode='provider';
}
function pickTestProvider(n){
  numMode=null; let pid;
  if(n===1) pid='all';
  else if(n>=2 && n<=providers.length+1) pid=providers[n-2].id;
  else { termLog('범위를 벗어난 번호: '+n); return; }
  if(pid!=='all') localStorage.setItem('nemesisProvider',pid);
  termLog('▶ 선택: '+(pid==='all'?'전체 사용':provById(pid).label));
  runTestWith(pid);
}
function printModels(){
  const pid=curProvider(), p=provById(pid);
  if(!p){ termLog('제공자 목록 로딩 중… 잠시 후 /model 다시 입력.'); loadProviders(); return; }
  const cur=modelFor(pid); termLog('현재 제공자: '+p.label+' · 모델: '+cur+'\n── 모델 목록 ──');
  p.models.forEach((m,i)=>termLog(String(i+1).padStart(2,' ')+'.  '+m+(m===cur?'   ← 현재':'')));
  termLog('▶ 번호를 입력하면 모델이 즉시 변경됩니다.'); numMode='model';
}
function pickModel(n){
  numMode=null; const pid=curProvider(), p=provById(pid);
  if(!p||n<1||n>p.models.length){ termLog('범위를 벗어난 번호: '+n); return; }
  const m=p.models[n-1]; localStorage.setItem('nemesisModel_'+pid,m);
  termLog('✔ 모델 변경: '+p.label+' → '+m); toast('모델: '+m,'success');
}
// ---- real-terminal editing helpers ----
// Command history persists across app restarts (localStorage), so ↑/↓ recalls
// commands from previous sessions — like a real shell's ~/.bash_history.
let cmdHist=(()=>{ try{ const h=JSON.parse(localStorage.getItem('nemesisCmdHist')||'[]'); return Array.isArray(h)?h:[]; }catch(e){ return []; } })();
let histPos=cmdHist.length;
function saveHist(){ try{ localStorage.setItem('nemesisCmdHist', JSON.stringify(cmdHist.slice(-200))); }catch(e){} }
function setCaretEnd(el){ const n=el.value.length; el.setSelectionRange(n,n); }
function tabComplete(el){
  const sg=$('#termsuggest'), v=el.value;
  if(!v.startsWith('/')) return;
  const f=v.toLowerCase(), ms=SLASH.filter(([c])=>c.startsWith(f));
  if(!ms.length) return;
  if(ms.length===1){ el.value=ms[0][0]+' '; setCaretEnd(el); sg.style.display='none'; return; }
  let pre=ms[0][0]; ms.forEach(([c])=>{ while(pre && !c.startsWith(pre)) pre=pre.slice(0,-1); });
  if(pre.length>v.length){ el.value=pre; setCaretEnd(el); }
  sg.innerHTML=ms.map(([c,d])=>`<div class="sgrow" data-c="${c}"><b>${c}</b><span class="muted">${d}</span></div>`).join('');
  sg.style.display='block';
  sg.querySelectorAll('.sgrow[data-c]').forEach(r=>r.onclick=()=>{ if(r.dataset.c){ el.value=r.dataset.c+' '; } el.focus(); sg.style.display='none'; });
}
function beginKeyPrompt(pid){
  pid=pid||curProvider(); keyState=pid; ensureTerminal(); setPwMode(true);
  const p=provById(pid);
  termLog('🔑 '+(p?p.label:pid)+' API 키를 붙여넣고 Enter 하세요. (이 브라우저에만 저장'+(p?' · 발급: '+p.keys_url:'')+')');
  setTimeout(()=>$('#terminput').focus(),0);
}
async function runTest(){                       // /test → 제공자 선택 메뉴
  const target=$('#url').value.trim();
  if(!target){ termLog('✗ 대상 URL을 상단에 먼저 입력하세요.'); toast('대상 URL을 입력하세요','error'); return; }
  if(testActive){ termLog('이미 분석이 진행 중입니다.'); return; }
  printProviders();
}
async function runTestWith(provider){
  const target=$('#url').value.trim();
  if(!target){ termLog('✗ 대상 URL을 먼저 입력하세요.'); return; }
  if(testActive){ termLog('이미 분석이 진행 중입니다.'); return; }
  const plabel=provider==='all'?'전체 제공자':(provById(provider)?provById(provider).label:provider);
  termLog('🧠 '+plabel+' + 로컬 ML/DL 앙상블 분석 시작 — 리컨·검수·권장공격…');
  let j;
  try{
    const r=await fetch('/api/test',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({target,provider,keys:allKeys(),models:allModels()})});
    j=await r.json();
    if(!r.ok){ if(j.need_key){ termLog('🔑 '+plabel+' 키가 필요합니다.'); pendingTest=provider; beginKeyPrompt(j.provider||(provider==='all'?curProvider():provider)); return; }
      throw new Error(j.error||'시작 실패'); }
  }catch(e){ toast(e.message||'분석 실패','error'); termLog('✗ '+(e.message||'실패')); return; }
  toast(plabel+' 분석을 시작합니다','info');
  testActive=true; testSeen=false;
  try{ const s=await (await fetch('/api/state?logs=0&finds=0')).json(); logCur=s.log_total; }catch(e){}
  clearInterval(testPoller); testPoller=setInterval(pollTest,700); pollTest();
}
async function pollTest(){
  try{
    const r=await fetch(`/api/state?logs=${logCur}&finds=0`); const s=await r.json();
    if(s.logs&&s.logs.length){ $('#log').textContent+=s.logs.join('\n')+'\n'; logCur=s.log_total; $('#log').scrollTop=$('#log').scrollHeight; }
    if(s.llm_running) testSeen=true;
    if(testSeen && !s.llm_running){
      clearInterval(testPoller); testActive=false;
      if(s.llm_result){ addLlmReport(s.llm_result); toast('LLM 분석 완료 · 보고서 저장됨','success',3400); }
      else toast('LLM 분석 종료','info');
    }
  }catch(e){}
}
function addLlmReport(md){
  const url=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));
  reports.unshift({ts:nowStamp()+' · LLM', url}); $('#btnReport').disabled=false;
  if($('#files').classList.contains('open') && $('#files').dataset.kind==='report') renderFiles('report');
}
// ---- SAST (소스코드 취약점 분석) ----
let sastActive=false, sastPoller=null, sastSeen=false;
async function runSast(path){
  if(sastActive){ termLog('이미 SAST 분석이 진행 중입니다.'); return; }
  termLog('🔬 SAST 소스코드 취약점 분석 시작 — CWE 휴리스틱'+' + CodeBERT(설치 시)…');
  let j;
  try{
    const r=await fetch('/api/sast',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});
    j=await r.json();
    if(!r.ok) throw new Error(j.error||'시작 실패');
  }catch(e){ toast(e.message||'SAST 실패','error'); termLog('✗ '+(e.message||'실패')); return; }
  toast('SAST 분석을 시작합니다','info');
  sastActive=true; sastSeen=false;
  try{ const s=await (await fetch('/api/state?logs=0&finds=0')).json(); logCur=s.log_total; }catch(e){}
  clearInterval(sastPoller); sastPoller=setInterval(pollSast,600); pollSast();
}
async function pollSast(){
  try{
    const r=await fetch(`/api/state?logs=${logCur}&finds=0`); const s=await r.json();
    if(s.logs&&s.logs.length){ $('#log').textContent+=s.logs.join('\n')+'\n'; logCur=s.log_total; $('#log').scrollTop=$('#log').scrollHeight; }
    if(s.sast_running) sastSeen=true;
    if(sastSeen && !s.sast_running){
      clearInterval(sastPoller); sastActive=false;
      if(s.sast_result){ addSastReport(s.sast_result); toast('SAST 분석 완료 · 보고서 저장됨','success',3400); }
      else toast('SAST 분석 종료','info');
    }
  }catch(e){}
}
function addSastReport(md){
  const url=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));
  reports.unshift({ts:nowStamp()+' · SAST', url}); $('#btnReport').disabled=false;
  if($('#files').classList.contains('open') && $('#files').dataset.kind==='report') renderFiles('report');
}
let allModules=[], attackList=[];
function ensureTerminal(){ const t=[...$$('#bottom .tab')].find(x=>x.dataset.t==='log'); if(t) t.click(); }
function beginCredPrompt(){
  credPrompting=true; credState='user'; ensureTerminal();
  termLog('\n🔐 로그인 페이지가 감지되었습니다. 로그인 정보를 입력하세요.');
  termLog('아이디/이메일:'); setTimeout(()=>$('#terminput').focus(),0);
}
const SLASH=[['/help','명령어 목록'],['/start','🤖 AI 공격 에이전트 시작 — 크롤·분석(ML)·실제 공격 (/start [url])'],
  ['/test','🧠 멀티-LLM 취약점 분석 — 제공자 선택(전체/Gemini/Groq/OpenAI…) + 로컬 ML 앙상블 (/test [url])'],
  ['/sast','🔬 소스코드 취약점 분석(SAST) — CWE 휴리스틱 + CodeBERT (/sast <파일/폴더 경로>)'],
  ['/model','현재 제공자의 모델 변경 — 목록 표시 후 숫자 입력'],
  ['/key','LLM 제공자 API 키 저장/삭제 (/key <제공자>, /key 로 목록)'],
  ['/attack','공격 기법 목록 (번호 입력 시 단독 실행) · /attack <검색어> 로 필터'],
  ['/login','자동 로그인 미리 설정'],
  ['/stop','스캔 중지'],['/status','대상/로그인/선택 상태'],['/clearlogin','로그인 정보 삭제'],['/clear','터미널 지우기']];
function termLog(s){ const el=$('#log'); el.textContent+=s+'\n'; el.scrollTop=el.scrollHeight; }
function setPwMode(on){ const el=$('#terminput'); el.type=on?'password':'text';
  el.placeholder=on?'비밀번호 입력 후 Enter':'명령 입력 —  /  로 명령어 보기'; }
function printAttack(filter){
  let list=allModules;
  if(filter){ const f=filter.toLowerCase();
    list=allModules.filter(m=>m.id.toLowerCase().includes(f)||m.name.toLowerCase().includes(f)||m.category.toLowerCase().includes(f)); }
  attackList=list;
  if(!list.length){ termLog('일치하는 기법 없음: '+filter); return; }
  let cat='', lines=[];
  list.forEach((m,i)=>{ if(m.category!==cat){cat=m.category; lines.push('── '+cat+' ──');}
    lines.push(String(i+1).padStart(3,' ')+'.  '+m.name+'   ['+m.id+']'); });
  termLog(lines.join('\n')+'\n\n▶ 번호를 입력하면 해당 공격을 대상 URL에 실행합니다.'+(filter?'':'  (목록이 길면 /attack <검색어> 로 좁히세요)'));
}
function runAttackByIndex(n){
  if(!attackList.length){ termLog('먼저 /attack 로 목록을 표시하세요.'); return; }
  if(n<1||n>attackList.length){ termLog('범위를 벗어난 번호: '+n); return; }
  const m=attackList[n-1];
  if(!$('#url').value.trim()){ termLog('✗ 대상 URL을 상단에 먼저 입력하세요.'); toast('대상 URL을 입력하세요','error'); return; }
  termLog('▶ 실행 ['+n+'] '+m.name+'   ['+m.id+']');
  launchScan([m.id], m.name+' 실행');
}
function handleTerm(val){
  if(keyState){
    termLog('› ••••••••');
    const pid=keyState; keyState=null; setPwMode(false);
    if(val.trim()){ localStorage.setItem('nemesisKey_'+pid, val.trim());
      const p=provById(pid); termLog('✔ '+(p?p.label:pid)+' 키 저장됨 (이 브라우저에만 보관).'); toast('키 저장됨','success');
      if(pendingTest){ const pt=pendingTest; pendingTest=null; runTestWith(pt); } }
    else { termLog('키 미입력 — 취소됨.'); pendingTest=null; }
    return;
  }
  if(credState){
    termLog('› '+(credState==='pass'?'••••••':val));
    if(credState==='user'){ credBuf={username:val.trim()}; termLog('비밀번호:'); credState='pass'; setPwMode(true); }
    else if(credState==='pass'){ credBuf.password=val; credState=null; setPwMode(false);
      termLog('로그인 시도 중… (라이브 뷰에서 진행 확인)');
      fetch('/api/credentials',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(credBuf)});
      toast('로그인 정보 전송','info'); }
    return;
  }
  termLog('› '+(loginState==='pass'?'••••••':val));
  if(loginState){
    if(loginState==='url'){ loginCreds.login_url=val.trim(); termLog('아이디/이메일:'); loginState='user'; }
    else if(loginState==='user'){ loginCreds.username=val.trim(); termLog('비밀번호:'); loginState='pass'; setPwMode(true); }

    { const keyed=providers.filter(x=>keyFor(x.id)).length;

function viewerFraction(e){
  const img=$('#liveimg'); const r=img.getBoundingClientRect();
  const nw=img.naturalWidth||r.width, nh=img.naturalHeight||r.height;
  const scale=Math.min(r.width/nw, r.height/nh);       // object-fit:contain
  const dw=nw*scale, dh=nh*scale;
  const ox=r.left+(r.width-dw)/2, oy=r.top+(r.height-dh)/2;
  const x=e.clientX-ox, y=e.clientY-oy;
  if(x<0||y<0||x>dw||y>dh) return null;
  return {fx:x/dw, fy:y/dh};
}

  img.addEventListener('dblclick',e=>{ if(!interactive)return; e.preventDefault();
    const f=viewerFraction(e); if(f) sendInput({kind:'dblclick',...f}); });
  img.addEventListener('wheel',e=>{ if(!interactive)return; e.preventDefault();
    const f=viewerFraction(e)||{fx:.5,fy:.5}; sendInput({kind:'scroll',...f,dx:e.deltaX,dy:e.deltaY}); },{passive:false});
  img.addEventListener('keydown',e=>{ if(!interactive)return;
    if(e.key in IB_KEYS){ e.preventDefault(); sendInput({kind:'key',key:e.key}); }
    else if(e.key.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){ e.preventDefault(); sendInput({kind:'text',text:e.key}); }
  });
}

async function pollFrame(){
  if(dragging) return;                                   // yield the main thread during window drag

function drawToCanvas(url){

    const r=Math.min(recCanvas.width/img.width,recCanvas.height/img.height); const w=img.width*r,h=img.height*r;
    recCtx.drawImage(img,(recCanvas.width-w)/2,(recCanvas.height-h)/2,w,h); };
  img.src=url;
}

// Falls back to a normal download (default folder) where the picker is unavailable.
async function saveFile(data, name, mime, accept){
  const blob=(data instanceof Blob)?data:new Blob([data],{type:mime||'application/octet-stream'});
  if(window.showSaveFilePicker){
    try{
      const opts={suggestedName:name};
      if(accept) opts.types=[{description:(name.split('.').pop()||'file').toUpperCase()+' 파일', accept:accept}];
      const h=await window.showSaveFilePicker(opts);
      const w=await h.createWritable(); await w.write(blob); await w.close();
      toast('저장 완료: '+name,'success'); return true;
    }catch(e){ if(e && e.name==='AbortError') return false; }   // user canceled
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('다운로드: '+name,'success'); return true;
}
function b64ToBytes(b64){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k); return u; }
function slug(s){ return (s||'finding').replace(/[^a-z0-9_\-]+/gi,'_').slice(0,40); }
// Reproduction (curl) + raw request note — works for ANY finding.
function buildCurl(f){
  let method='GET', url=f.url||''; const req=f.request||'';
  const m=req.match(/^([A-Z]+)\s+(\S+)/); if(m){ method=m[1]; url=/^https?:/.test(m[2])?m[2]:(f.url||m[2]); }
  const L=['# 재현 (PoC) — '+(f.title||''), '# 대상: '+(f.url||''), '# 심각도: '+(f.severity||'')+' / 신뢰도: '+(f.confidence||''), ''];
  if(method==='GET'){ L.push(`curl -i -sk '${url}'`); }
  else {
    let c=`curl -i -sk -X ${method} '${url}'`;
    const hm=req.match(/\(([A-Za-z0-9\-]+):\s*([^)]+)\)/); if(hm) c+=` -H '${hm[1]}: ${hm[2].trim()}'`;
    const bm=req.match(/\(([^)]*=[^)]*)\)/); if(bm) c+=` --data '${bm[1]}'`;
    L.push(c);
  }
  if(f.request) L.push('', '# 요청 메모: '+f.request);
  return L.join('\n')+'\n';
}
function buildEvidence(f){
  const ex=f.extra||{};
  const L=['# 증거 (Evidence)', '',
    '- 취약점: '+(f.title||''), '- 심각도: '+(f.severity||''), '- 신뢰도: '+(f.confidence||''),
    '- 대상 URL: '+(f.url||''), '- 탐지 모듈: '+(f.module_id||''),
    (f.request?'- 요청: '+f.request:''), '', '## 증거 내용', (f.evidence||'(없음)')];
  if(ex.sensitive_actions&&ex.sensitive_actions.length) L.push('', '## 민감 기능(추정)', ex.sensitive_actions.join(', '));
  if(ex.proof) L.push('', '## 추출 정보 (Proof)', '```json', JSON.stringify(ex.proof,null,2), '```');
  if(ex.raw_request) L.push('', '## 실제 공격 요청 (Raw HTTP Request)', '```http', ex.raw_request, '```');
  if(ex.raw_response) L.push('', '## 응답 증빙 (Raw HTTP Response)', '```http', ex.raw_response, '```');
  if(ex.policy_downgraded) L.push('', '## 위험도 분류', '프로그램 정책상 저위험 유형으로 분류되어 위험도를 Low로 하향했습니다. (단, 이 취약점을 이용해 다른 곳을 실제로 침해한 경우는 별도 chain 항목으로 High 유지)');
  if(f.remediation) L.push('', '## 조치 방안', f.remediation);
  return L.filter(x=>x!==null&&x!==undefined).join('\n')+'\n';
}
async function showReport(i){
  const md=await (await fetch('/api/report?i='+i)).text();
  $('#mtitle').textContent='버그바운티 보고서';$('#mbody').textContent=md;$('#modal').classList.add('open');
  $('#mcopy').onclick=()=>{navigator.clipboard.writeText(md);toast('클립보드에 복사되었습니다','success');};
  const f=findingByIndex(i)||{}, ex=(f&&f.extra)||{}, base=slug(f.module_id);
  // Always-available proof files for every finding (pick save location).
  $('#mcurl').onclick=()=>saveFile(buildCurl(f), base+'_poc.txt', 'text/plain', {'text/plain':['.txt']});
  $('#mevi').onclick=()=>saveFile(buildEvidence(f), base+'_evidence.md', 'text/markdown', {'text/markdown':['.md']});
  // Rich HTML PoC / screenshot when the finding carries them (clickjacking, CSRF, CORS…).
  const poc=$('#mpoc'), shot=$('#mshot');
  if(ex.poc_html){ poc.style.display=''; poc.onclick=()=>saveFile(ex.poc_html, base+'_poc.html', 'text/html', {'text/html':['.html']}); }
  else poc.style.display='none';
  if(ex.screenshot_b64){ shot.style.display=''; shot.onclick=()=>saveFile(new Blob([b64ToBytes(ex.screenshot_b64)],{type:'image/png'}), base+'_poc.png', 'image/png', {'image/png':['.png']}); }
  else shot.style.display='none';
  // Feedback → learning data (retrain with tools/train_model.py to apply).
  $('#mtp').onclick=()=>sendFeedback(i,1);
  $('#mfp').onclick=()=>sendFeedback(i,0);
}
async function sendFeedback(i,label){
  try{ const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:i,label})});
    if(!r.ok) throw 0;
    toast(label?'정탐으로 학습 데이터에 추가':'오탐으로 학습 데이터에 추가','success');
  }catch(e){ toast('피드백 전송 실패','error'); }
}
async function downloadFullReport(){
  const md=await (await fetch('/api/report')).text();
  await saveFile(md, 'bugbounty_report.md', 'text/markdown', {'text/markdown':['.md']});
}

const OPT_IDS=['o_headless','o_devtools','o_tls','o_fpfilter','o_strict','o_policy','o_sandbox','o_sqlitime','o_browserev','o_minscore','o_delay','o_timeout','o_crawl','o_depth','o_pages','o_ua','o_headers','o_cookies','o_canary','o_poll'];
let _optSnap={};
function getOpts(){const o={};OPT_IDS.forEach(id=>{const el=$('#'+id);if(el)o[id]=el.type==='checkbox'?el.checked:el.value;});return o;}
function setOpts(o){OPT_IDS.forEach(id=>{const el=$('#'+id);if(!el||!(id in o))return;if(el.type==='checkbox')el.checked=o[id];else el.value=o[id];});}
function loadOpts(){try{const s=localStorage.getItem('bbopts');if(s)setOpts(JSON.parse(s));}catch(e){}}

$$('#bottom .tab').forEach(t=>t.onclick=()=>{
  $$('#bottom .tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
  const isLog=t.dataset.t==='log';
  $('#findwrap').style.display=isLog?'none':'';$('#log').style.display=isLog?'':'none';
  $('#terminput-row').style.display=isLog?'flex':'none';
  if(isLog) setTimeout(()=>$('#terminput').focus(),0);
});
$('#terminput').addEventListener('keydown',e=>{
  const el=e.target, sg=$('#termsuggest'), inPrompt=(credState||loginState||keyState);
  if(e.key==='Enter'){ const v=el.value; el.value=''; sg.style.display='none';
    if(v.trim() && !inPrompt && el.type!=='password'){ if(cmdHist[cmdHist.length-1]!==v){ cmdHist.push(v); if(cmdHist.length>200) cmdHist.shift(); saveHist(); } }
    histPos=cmdHist.length; handleTerm(v); return; }
  if(e.key==='Escape'){ sg.style.display='none'; return; }
  if(e.key==='ArrowUp' && !inPrompt){ e.preventDefault(); if(cmdHist.length){ histPos=Math.max(0,histPos-1); el.value=cmdHist[histPos]||''; setCaretEnd(el); } return; }
  if(e.key==='ArrowDown' && !inPrompt){ e.preventDefault(); if(cmdHist.length){ histPos=Math.min(cmdHist.length,histPos+1); el.value=histPos<cmdHist.length?cmdHist[histPos]:''; setCaretEnd(el); } return; }
  if(e.key==='Tab'){ e.preventDefault(); if(!inPrompt) tabComplete(el); return; }
  if(!e.ctrlKey) return;
  const k=e.key.toLowerCase();
  if(k==='l'){ e.preventDefault(); $('#log').textContent=''; return; }               // clear screen
  if(k==='c'){ if(el.selectionStart===el.selectionEnd){ e.preventDefault(); termLog('› '+el.value+'^C'); el.value=''; sg.style.display='none';
      if(inPrompt){ credState=loginState=keyState=null; setPwMode(false); termLog('(입력 취소됨)'); } numMode=null; pendingTest=null; } return; }  // SIGINT-style cancel
  if(k==='u'){ e.preventDefault(); el.value=el.value.slice(el.selectionStart); el.setSelectionRange(0,0); return; }   // kill to line start
  if(k==='k'){ e.preventDefault(); el.value=el.value.slice(0,el.selectionStart); return; }                            // kill to line end
  if(k==='w'){ e.preventDefault(); const p=el.value.slice(0,el.selectionStart), rest=el.value.slice(el.selectionStart);
    const np=p.replace(/\s*\S+\s*$/,''); el.value=np+rest; el.setSelectionRange(np.length,np.length); return; }        // delete prev word
  if(k==='a'){ e.preventDefault(); el.setSelectionRange(0,0); return; }              // move to start
  if(k==='e'){ e.preventDefault(); setCaretEnd(el); return; }                        // move to end
});
$('#terminput').addEventListener('input',e=>{
  const v=e.target.value, sg=$('#termsuggest');
  if(v.startsWith('/') && loginState===null){
    const f=v.toLowerCase(), ms=SLASH.filter(([c])=>c.startsWith(f)||f==='/');
    sg.innerHTML=(ms.length?ms:[['','일치 명령 없음']]).map(([c,d])=>`<div class="sgrow" data-c="${c}"><b>${c}</b><span class="muted">${d}</span></div>`).join('');
    sg.style.display='block';
    sg.querySelectorAll('.sgrow[data-c]').forEach(r=>r.onclick=()=>{ if(r.dataset.c){ $('#terminput').value=r.dataset.c+' '; } $('#terminput').focus(); sg.style.display='none'; });
  } else sg.style.display='none';
});

// Titlebar drag uses pywebview's native frameless drag (the `.pywebview-drag-region`
// class on #titlebar). We only pause the live-view polling while dragging so the
// native move stays responsive; nothing else is intercepted.
(function(){
  const tb=$('#titlebar'); if(!tb) return;
  tb.addEventListener('mousedown', e=>{ if(e.target && e.target.closest && e.target.closest('.winbtn')) return; beginDrag(); });
  ['mouseup','pointerup','blur'].forEach(ev=>window.addEventListener(ev, endDrag));
})();
